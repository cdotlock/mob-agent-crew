services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: mob
      POSTGRES_PASSWORD: mob
      POSTGRES_DB: mob
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mob -d mob"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - mob-postgres:/var/lib/postgresql/data

volumes:
  mob-postgres:
